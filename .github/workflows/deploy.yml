# Auslieferung: Das alte Spiel wird veröffentlicht, sobald SEINE Tests grün sind.
# /v2/ kommt nur dazu, wenn auch die Tests von v2 grün sind. Ein rotes v2 blockiert
# das alte Spiel nie und wird nie ungetestet veröffentlicht.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  alt:
    name: Altes Spiel prüfen und bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: test -f dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: alt
          path: dist/
          if-no-files-found: error
          retention-days: 1

  v2:
    name: v2 prüfen und bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - run: npm ci
        working-directory: v2

      - run: npm run typecheck
        working-directory: v2

      - run: npm test
        working-directory: v2

      - run: npx playwright install --with-deps chromium
        working-directory: v2

      - run: npm run test:e2e
        working-directory: v2

      - run: npm run build
        working-directory: v2

      - run: test -f dist/v2/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: v2
          path: dist/v2/
          if-no-files-found: error
          retention-days: 1

  seite:
    name: Seite zusammenstellen
    needs: [alt, v2]
    if: ${{ always() && needs.alt.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alt
          path: dist

      - if: ${{ needs.v2.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: v2
          path: dist/v2

      - name: Inhalt der Auslieferung
        run: |
          ls dist
          if [ "${{ needs.v2.result }}" != "success" ]; then
            echo "::warning::v2 fehlt in dieser Auslieferung (Ergebnis: ${{ needs.v2.result }})"
          fi

      - run: test -f dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: seite
    if: ${{ always() && needs.seite.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
